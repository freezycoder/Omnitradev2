name: Desktop build

# Builds the OmniTrade desktop app (Tauri + bundled FastAPI backend + static
# Next.js frontend) into native installers for macOS and Windows. Runs on tags
# and can be triggered manually. Artifacts are uploaded per-platform.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: omnitrade-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: omnitrade-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: omnitrade-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Create Python venv and install backend deps
        shell: bash
        run: |
          python -m venv .venv
          if [ -x ".venv/Scripts/python.exe" ]; then PY=".venv/Scripts/python.exe"; else PY=".venv/bin/python"; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements.txt pyinstaller

      - name: Build backend bundle (PyInstaller)
        shell: bash
        run: bash desktop/backend/build_backend.sh

      - name: Build frontend static export
        shell: bash
        env:
          OMNITRADE_DESKTOP: "1"
          NEXT_PUBLIC_OMNITRADE_API_URL: "http://127.0.0.1:8788"
        run: |
          npm --prefix frontend ci || npm --prefix frontend install
          npm --prefix frontend run build

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
